name: Website quality gates
on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - '.github/workflows/site-quality.yml'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local links, page structure and assets
        run: node scripts/check-site.mjs
      - name: Install browser test tooling
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop, mobile and ultrawide layouts
        run: npx playwright test
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackreef-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
